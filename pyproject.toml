[project]
name = "kdp-niche-scorer-mcp"
version = "1.0.0"
description = "AI-native Amazon KDP niche scoring — feed a keyword, get BSR, competitor count, page count, review velocity, and estimated monthly sales as one opinionated score."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastmcp>=2.13,<3",
    "rich>=14.0",
    "httpx>=0.28",
    "cachetools>=5.5",
]

[project.urls]
Repository = "https://github.com/username/kdp-niche-scorer-mcp"
Documentation = "https://mcpize.com/docs"

[project.scripts]
kdp-niche-scorer-mcp = "kdp_niche_scorer_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kdp_niche_scorer_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
